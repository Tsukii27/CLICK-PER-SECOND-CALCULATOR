<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">

<body>
    <div class="cps-container">
        <h1>Click-Per-Second Calculator</h1>

        <p id="cpsDisplay">START CLICKING TO CALCULATE CPS!</p>
    </div>
</body>
